# Example Nginx configuration for osu-stream-bot Control UI
# Place in /etc/nginx/sites-available/osu-stream and link to /etc/nginx/sites-enabled/
#
# Create htpasswd file:
#   sudo apt install -y apache2-utils
#   sudo htpasswd -c /etc/nginx/.htpasswd admin

server {
    listen 80;
    server_name stream.example.com; # Change to your domain or VPS public IP

    # Redirect all HTTP to HTTPS (recommended in production)
    # return 301 https://$host$request_uri;

    # Protect control dashboard with Basic Auth
    location /control {
        auth_basic "Restricted osu-stream control panel";
        auth_basic_user_file /etc/nginx/.htpasswd;

        proxy_pass http://127.0.0.1:8787/control;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # WebSocket support (for control updates if needed)
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        client_max_body_size 25M;
    }

    # Static assets required by control page
    location /static/ {
        proxy_pass http://127.0.0.1:8787/static/;
        proxy_set_header Host $host;
    }

    # Deny direct public access to internal player route (OBS browser source accesses it via localhost)
    location / {
        return 403 "Forbidden";
    }
}
